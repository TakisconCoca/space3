<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Musical Glassmorphism</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (para los iconos de los botones) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* Bloquear scroll horizontal para evitar desbordes */
        body, html {
            overflow-x: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }

        /* Capa de fondo fija para evitar saltos en móviles (Safari/Chrome Mobile) */
        .bg-fixed-mobile {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://xatimg.com/image/g4gbuu2npBIQ.png');
            background-size: cover;
            background-position: center;
            z-index: 0; /* Al fondo del todo */
            pointer-events: none;
        }

        /* Utilidad de cristal (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border-radius: 1.5rem;
            transition: all 0.4s ease;
        }

        /* Scrollbar customization for lists */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Efecto Onda de Agua Simple */
        .water-ripple {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ripple-expand 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            pointer-events: none; 
            z-index: 1; /* Sobre el fondo pero bajo los cristales */
        }

        @keyframes ripple-expand {
            0% { width: 0px; height: 0px; opacity: 1; border: 3px solid rgba(255, 255, 255, 0.4); box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.4); }
            100% { width: 350px; height: 350px; opacity: 0; border: 0px solid rgba(255, 255, 255, 0); box-shadow: inset 0 0 0px rgba(255, 255, 255, 0); }
        }

        /* Transición suave para las barras del sound wave */
        .wave-bar {
            transition: height 0.15s ease;
        }
    </style>
</head>

    <!-- Scripts funcionales -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Lógica para ocultar/mostrar cuadros
            const toggleBtn = document.getElementById('toggle-btn');
            const toggleIcon = document.getElementById('toggle-icon');
            const toggleText = document.getElementById('toggle-text');
            
            // Seleccionamos específicamente todos los paneles de cristal y la firma, ignorando el botón principal
            const hideableElements = document.querySelectorAll('.glass-panel:not(#toggle-btn), .text-right.pr-2');
            let isHidden = false;

            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Evita que el clic propague al fondo
                isHidden = !isHidden;
                
                hideableElements.forEach(el => {
                    // Agregamos la transición por si el elemento no la tiene por defecto (como la firma)
                    el.style.transition = 'opacity 0.4s ease';
                    
                    if (isHidden) {
                        el.style.opacity = '0';
                        el.style.pointerEvents = 'none';
                    } else {
                        el.style.opacity = '1';
                        el.style.pointerEvents = 'auto';
                    }
                });

                if (isHidden) {
                    toggleIcon.classList.replace('ph-eye-slash', 'ph-eye');
                    toggleText.textContent = 'Mostrar';
                } else {
                    toggleIcon.classList.replace('ph-eye', 'ph-eye-slash');
                    toggleText.textContent = 'Ocultar';
                }
            });

            // 2. Efecto de agua simple
            document.body.addEventListener('click', (e) => {
                // No activar el agua si dimos clic en el botón de ocultar
                if(e.target.closest('#toggle-btn')) return;

                const container = document.getElementById('ripple-container');
                if(!container) return; 

                const ripple = document.createElement('div');
                ripple.classList.add('water-ripple');
                
                // Centramos el círculo en la coordenada del clic
                ripple.style.left = `${e.clientX}px`;
                ripple.style.top = `${e.clientY}px`;
                
                container.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 1200); 
            });

            // 3. (Contador de visitas eliminado y reemplazado por control de video en los eventos del audio)
            
            // 4. Lógica Completa del Reproductor de Música y Playlists
            const currentAudio = new Audio();
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playIcon = document.getElementById('play-icon');
            const mainSongTitle = document.getElementById('main-song-title');
            
            // Controles de tiempo
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const totalTimeEl = document.getElementById('total-time');
            
            // Botones secundarios
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const likeBtn = document.getElementById('like-btn');
            let isLiked = true;

            // Recolectar datos de las canciones desde el HTML
            const playlistElements = document.querySelectorAll('.playlist-item');
            const playlist = [];
            let currentIndex = 0;

            playlistElements.forEach((el, index) => {
                playlist.push({
                    title: el.getAttribute('data-title'),
                    src: el.getAttribute('data-src'),
                    element: el
                });

                // Clic en la lista de reproducción
                el.addEventListener('click', (e) => {
                    e.stopPropagation(); // Evita ripple si se quiere
                    playSong(index);
                });
            });

            // Función principal para reproducir canción por índice
            function playSong(index) {
                if(index < 0) index = playlist.length - 1;
                if(index >= playlist.length) index = 0;
                
                currentIndex = index;
                const song = playlist[currentIndex];
                
                // Actualizar interfaz
                mainSongTitle.textContent = song.title;
                currentAudio.src = song.src;
                
                // Efecto de canción activa en la lista (Letras verdes)
                playlistElements.forEach(el => {
                    const titleText = el.querySelector('.song-title-text');
                    if (titleText) {
                        titleText.classList.remove('text-[#1DB954]');
                        titleText.classList.add('text-white/80');
                    }
                });
                const activeTitle = song.element.querySelector('.song-title-text');
                if (activeTitle) {
                    activeTitle.classList.remove('text-white/80');
                    activeTitle.classList.add('text-[#1DB954]');
                }

                // Manejar promesa de reproducción para evitar AbortError
                const playPromise = currentAudio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playIcon.classList.replace('ph-play', 'ph-pause');
                        playIcon.classList.remove('ml-1'); // Ajuste visual del pause
                    }).catch(error => {
                        // Ignoramos el error si el usuario cambia de canción muy rápido
                        if (error.name !== 'AbortError') {
                            console.error("Error al reproducir audio:", error);
                        }
                    });
                }
            }

            // Reproducir / Pausar
            playPauseBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if(!currentAudio.src) {
                    // Si no hay canción, poner la primera
                    playSong(0);
                    return;
                }

                if (currentAudio.paused) {
                    const playPromise = currentAudio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            playIcon.classList.replace('ph-play', 'ph-pause');
                            playIcon.classList.remove('ml-1');
                        }).catch(e => { if (e.name !== 'AbortError') console.error(e); });
                    }
                } else {
                    currentAudio.pause();
                    playIcon.classList.replace('ph-pause', 'ph-play');
                    playIcon.classList.add('ml-1');
                }
            });

            // Siguiente / Anterior
            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playSong(currentIndex + 1);
            });
            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playSong(currentIndex - 1);
            });

            // Autoplay siguiente al terminar
            currentAudio.addEventListener('ended', () => {
                playSong(currentIndex + 1);
            });

            // Funcionalidad de "Me gusta"
            likeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                isLiked = !isLiked;
                const icon = likeBtn.querySelector('i');
                if (isLiked) {
                    likeBtn.classList.add('text-[#1DB954]');
                    likeBtn.classList.remove('text-white/50');
                    icon.classList.replace('ph', 'ph-fill');
                } else {
                    likeBtn.classList.remove('text-[#1DB954]');
                    likeBtn.classList.add('text-white/50');
                    icon.classList.replace('ph-fill', 'ph');
                }
            });

            // Formatear el tiempo a mm:ss
            function formatTime(seconds) {
                if (isNaN(seconds)) return "-:--";
                const min = Math.floor(seconds / 60);
                const sec = Math.floor(seconds % 60);
                return `${min}:${sec.toString().padStart(2, '0')}`;
            }

            // Cargar metadata de tiempo
            currentAudio.addEventListener('loadedmetadata', () => {
                totalTimeEl.textContent = formatTime(currentAudio.duration);
            });

            // Actualizar barra de progreso y tiempo
            currentAudio.addEventListener('timeupdate', () => {
                currentTimeEl.textContent = formatTime(currentAudio.currentTime);
                if (currentAudio.duration) {
                    const progressPercent = (currentAudio.currentTime / currentAudio.duration) * 100;
                    progressBar.style.width = `${progressPercent}%`;
                }
            });

            // Hacer clic en la barra para adelantar/atrasar
            progressContainer.addEventListener('click', (e) => {
                e.stopPropagation();
                if(currentAudio.src) {
                    const width = progressContainer.clientWidth;
                    const clickX = e.offsetX;
                    const duration = currentAudio.duration;
                    currentAudio.currentTime = (clickX / width) * duration;
                }
            });

            // Mostrar bolita en la barra al hacer hover (UI detail)
            progressContainer.addEventListener('mouseenter', () => {
                document.getElementById('progress-handle').classList.remove('scale-0');
                document.getElementById('progress-handle').classList.add('scale-100');
            });
            progressContainer.addEventListener('mouseleave', () => {
                document.getElementById('progress-handle').classList.add('scale-0');
                document.getElementById('progress-handle').classList.remove('scale-100');
            });

            // 5. Animación Dinámica del Sound Wave (sincronizada con estado del audio)
            const waveBars = document.querySelectorAll('.wave-bar');
            let waveInterval;

            function animateWaves() {
                waveBars.forEach(bar => {
                    // Alturas aleatorias entre 10% y 100% de su capacidad para dar efecto de ecualizador
                    const randomHeight = Math.floor(Math.random() * 24) + 8; // entre 8px y 32px
                    bar.style.height = `${randomHeight}px`;
                });
            }

            function resetWaves() {
                waveBars.forEach(bar => {
                    bar.style.height = '4px'; // Reposo
                });
            }

            currentAudio.addEventListener('play', () => {
                if(waveInterval) clearInterval(waveInterval);
                waveInterval = setInterval(animateWaves, 150); // Cambia cada 150ms
                
                // Reproducir el video vertical al mismo tiempo
                const syncVideo = document.getElementById('sync-video');
                if(syncVideo) syncVideo.play();
            });

            currentAudio.addEventListener('pause', () => {
                clearInterval(waveInterval);
                resetWaves();
                
                // Pausar el video vertical cuando la música se detiene
                const syncVideo = document.getElementById('sync-video');
                if(syncVideo) syncVideo.pause();
            });
            
            // Iniciar en reposo
            resetWaves();
        });
    </script>
</body>
</html>
